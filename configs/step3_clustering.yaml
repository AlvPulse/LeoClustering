# Hyperparameter grids for clustering algorithms
algorithms:
  stream_kmeans:
    n_clusters: [5, 10, 20]
    halflife: [0.5, 0.1]
    sigma: [1.0, 1.5]
  denstream:
    epsilon: [0.1, 0.5]
    beta: [0.2, 0.5]
    mu: [2.0, 5.0]
  hdbscan:
    min_cluster_size: [3, 5, 10]
    min_samples: [1, 3, 5]
  umap_hdbscan:
    n_neighbors: [5, 15]
    min_dist: [0.0, 0.1]
    min_cluster_size: [3, 5]
    min_samples: [1, 3]

memory_limit_mb: 2000
